APPLY_FIXES: none
DEFAULT_BRANCH: main
DISABLE_ERRORS_LINTERS: []
DISABLE_LINTERS:
  - CSS_STYLELINT
  - REPOSITORY_DEVSKIM
  - REPOSITORY_GRYPE
  - REPOSITORY_TRIVY
  - BASH_EXEC
  - BASH_SHELLCHECK
  - BASH_SHFMT
  - TYPESCRIPT_STANDARD
FILTER_REGEX_EXCLUDE: >-
  (node_modules/|\.git/|\.next/|\.eve/|\.vercel/|docs/df-progress-board-|vendor/)
# Vendored OpenSandbox charts are committed in-tree (per #553) and regenerated by
# scripts/sandbox-vendor/vendor.sh. They are third-party upstream files: their READMEs
# carry upstream-relative links and their values.yaml ships placeholder keys/test vectors.
# We must not mutate them, so scope these linters off the vendor tree.
MARKDOWN_MARKDOWN_LINK_CHECK_FILTER_REGEX_EXCLUDE: (vendor/)
REPOSITORY_KICS_FILTER_REGEX_EXCLUDE: (vendor/)
JAVASCRIPT_DEFAULT_STYLE: prettier
JSON_PRETTIER_FILTER_REGEX_EXCLUDE: (\.next/|\.eve/|\.vercel/|node_modules/)
# tsqllint is Microsoft's T-SQL linter; this repo's migrations are PostgreSQL
# (CREATE TABLE IF NOT EXISTS, ENABLE ROW LEVEL SECURITY), which T-SQL reports
# as syntax errors. Exclude the migration directory rather than the linter.
SQL_TSQLLINT_FILTER_REGEX_EXCLUDE: (db/migrations/)
PRINT_ALPACA: false
SHOW_ELAPSED_TIME: true
SPELL_LYCHEE_ARGUMENTS: --format detailed --no-progress --root-dir /github/workspace
SPELL_CSPELL_FILE_EXTENSIONS:
  - .ts
  - .tsx
  - .md
  - .json
  - .yml
  - .yaml
  - .css
VALIDATE_ALL_CODEBASE: false
YAML_YAMLLINT_FILTER_REGEX_EXCLUDE: (\.vercel/|\.next/|\.eve/)
