name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  checks: write
  actions: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Loopback-only, ephemeral container: trust auth avoids putting a
          # password in the workflow (and a kics "password in URL" finding).
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: darkfactory
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Provisions a disposable Postgres so the gated Dark Factory integration
      # tests (#219 R2, #213) actually run in CI instead of being skipped.
      DF_TENANT_TEST_DATABASE_URL: postgres://postgres@localhost:5432/darkfactory?sslmode=disable
      DF_COST_BUDGET_TEST_DATABASE_URL: postgres://postgres@localhost:5432/darkfactory?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Eve Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    env:
      DF_PLATFORM_PROVIDER: generic
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build

  evals:
    name: Eve Evals
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run evals (Next.js + Eve dev server)
        env:
          EVE_API_KEY: ${{ secrets.EVE_API_KEY }}
          EVE_EVAL_AUTH_TOKEN: ${{ secrets.EVE_API_KEY }}
        run: |
          mkdir -p .eve
          npm run dev -- --hostname 127.0.0.1 --port 3000 > .eve/next-dev.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/eve/v1/health > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat .eve/next-dev.log
              exit 1
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:3000/eve/v1/health > /dev/null
          npx eve eval --strict --exclude-tag production --junit .eve/junit.xml --url http://127.0.0.1:3000
      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-results
          path: .eve/

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Seed the Dark Factory fixture
        env:
          # These suites assert on RENDERED panels, so the stores need rows:
          # an empty store shows the panel's empty state instead. Everything
          # lives in sqlite files under .eve/, so no real database is touched.
          DF_TENANT_DRIVER: sqlite
          DF_TENANT_DB_PATH: .eve/e2e-tenant.sqlite
          DF_USAGE_DRIVER: sqlite
          DF_USAGE_DB_PATH: .eve/e2e-usage.sqlite
          DF_COST_BUDGET_DRIVER: sqlite
          DF_COST_BUDGET_DB_PATH: .eve/e2e-cost.sqlite
          DF_RUN_HISTORY_DRIVER: sqlite
          DF_RUN_HISTORY_DB_PATH: .eve/e2e-runs.sqlite
          DF_CONTROL_DRIVER: sqlite
          DF_CONTROL_DB_PATH: .eve/e2e-control.sqlite
          DF_MEMBERSHIP_DRIVER: sqlite
          DF_MEMBERSHIP_DATABASE_PATH: .eve/e2e-membership.sqlite
        run: |
          mkdir -p .eve
          npm run seed:test-data -- --all
          # The dev-mode sign-in address must itself be a member: scope is
          # resolved from the membership store on every request (#215).
          npm run df:membership -- grant --email cuillinguy@gmail.com --role operator
      - name: Run browser tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
          # Dev-mode sign-in so the gated pages can be tested (fail-closed in production)
          AUTH_DEV_MODE: "1"
          # The same fixture the seed step wrote, so the dev server reads the
          # same rows and the dev-mode operator resolves (#215, #258).
          #
          # Deliberately WITHOUT DF_COST_BUDGET_DRIVER (or the control driver):
          # configuring the budget store arms the orchestrator's cost gate,
          # which then refuses every model call with `not_configured` until a
          # global cap is provisioned (ADR 0015). That broke the chat specs,
          # which exercise a real call through the proxy.
          DF_TENANT_DRIVER: sqlite
          DF_TENANT_DB_PATH: .eve/e2e-tenant.sqlite
          DF_USAGE_DRIVER: sqlite
          DF_USAGE_DB_PATH: .eve/e2e-usage.sqlite
          DF_RUN_HISTORY_DRIVER: sqlite
          DF_RUN_HISTORY_DB_PATH: .eve/e2e-runs.sqlite
          DF_MEMBERSHIP_DRIVER: sqlite
          DF_MEMBERSHIP_DATABASE_PATH: .eve/e2e-membership.sqlite
        run: npm run test:e2e
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          fetch-depth: 0
      - name: MegaLinter
        uses: oxsecurity/megalinter@e08c2b05e3dbc40af4c23f41172ef1e068a7d651
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  production-evals:
    name: Production Evals
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [evals]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run evals against production
        env:
          EVE_EVAL_AUTH_TOKEN: ${{ secrets.EVE_EVAL_AUTH_TOKEN }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          TARGET_URL="https://agent-eve-gold.vercel.app"
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            if [[ "$TARGET_URL" == *\?* ]]; then
              TARGET_URL="${TARGET_URL}&x-vercel-protection-bypass=${VERCEL_PROTECTION_BYPASS}"
            else
              TARGET_URL="${TARGET_URL}?x-vercel-protection-bypass=${VERCEL_PROTECTION_BYPASS}"
            fi
          else
            echo "::warning::VERCEL_PROTECTION_BYPASS is empty, so these evals will hit the Vercel Authentication wall and report \"Failed to create the session\". Set the VERCEL_PROTECTION_BYPASS Actions secret from Vercel -> Project Settings -> Deployment Protection -> Protection Bypass for Automation."
          fi
          npx eve eval --strict --junit .eve/junit-production.xml \
            --url "$TARGET_URL"
      - name: Upload production eval artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: eval-results-production
          path: .eve/
