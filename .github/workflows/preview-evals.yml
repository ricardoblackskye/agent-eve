name: Preview Evals

on:
  deployment_status:

permissions:
  contents: read
  checks: write
  actions: write
  pull-requests: write

env:
  NODE_VERSION: "24"

jobs:
  preview-evals:
    name: Vercel Preview Evals
    # Production deployments are excluded: their target_url is the production
    # host, which sits behind Vercel Authentication, so the evals would hit the
    # auth wall and fail with 401 before ever reaching the app. Production is
    # already covered by the production-evals job in ci.yml, which targets
    # agent-eve-gold.vercel.app directly. See issue #79.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment != 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Run evals against Vercel Preview URL
        env:
          EVE_EVAL_AUTH_TOKEN: ${{ secrets.EVE_EVAL_AUTH_TOKEN }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          TARGET_URL="${{ github.event.deployment_status.target_url }}"
          if [ -n "$VERCEL_PROTECTION_BYPASS" ]; then
            if [[ "$TARGET_URL" == *\?* ]]; then
              TARGET_URL="${TARGET_URL}&x-vercel-protection-bypass=${VERCEL_PROTECTION_BYPASS}"
            else
              TARGET_URL="${TARGET_URL}?x-vercel-protection-bypass=${VERCEL_PROTECTION_BYPASS}"
            fi
          fi
          npx eve eval --strict --junit .eve/junit-preview.xml \
            --url "$TARGET_URL"
      - name: Upload preview eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-preview
          path: .eve/
